name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # HALO Store stays at the site root; SDM Mobilya is served under /sdm-mobilya/
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r halo-store/. _site/
          mkdir -p _site/sdm-mobilya
          cp -r sdm-mobilya/. _site/sdm-mobilya/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
