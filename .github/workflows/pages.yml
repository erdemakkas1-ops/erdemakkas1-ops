name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Çetin Parke is a Next.js app: export it as a static site under its sub-folder
      - name: Build Çetin Parke
        working-directory: cetin-parke
        env:
          PAGES_BASE_PATH: /erdemakkas1-ops/cetin-parke
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build Alagözler Emlak
        working-directory: alagozler-emlak
        env:
          PAGES_BASE_PATH: /erdemakkas1-ops/alagozler-emlak
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # Ahima Dekorasyon: Next.js, exported the same way under its own sub-folder
      - name: Build Ahima Dekorasyon
        working-directory: ahima-dekorasyon
        env:
          PAGES_BASE_PATH: /erdemakkas1-ops/ahima-dekorasyon
        run: |
          npm install --no-audit --no-fund
          npm run build
      # Ahima 3D salon: React Three Fiber scroll demo, exported under its own sub-folder
      - name: Build Ahima 3D Salon
        working-directory: ahima-salon-3d
        env:
          PAGES_BASE_PATH: /erdemakkas1-ops/ahima-salon-3d
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # HALO stays at the site root; each demo gets its own folder next to it
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r halo-store/. _site/
          rsync -a --exclude instagram-raw arqli-interiors/ _site/arqli-interiors/
          cp -r sdm-mobilya/. _site/sdm-mobilya/
          cp -r cetin-parke/out/. _site/cetin-parke/
          cp -r alagozler-emlak/out/. _site/alagozler-emlak/
          cp -r ahima-dekorasyon/out/. _site/ahima-dekorasyon/
          cp -r ahima-salon-3d/out/. _site/ahima-salon-3d/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
