<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilyum Çiçeği</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#fff5f8; --bg2:#fde4ec; --text:#b03a62; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg1:#2a1420; --bg2:#14080f; --text:#ffb3cc; }
  }
  :root[data-theme="dark"] { --bg1:#2a1420; --bg2:#14080f; --text:#ffb3cc; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, var(--bg1), var(--bg2));
    font-family: 'Dancing Script', cursive; overflow-x: hidden;
  }
  svg { width: min(420px, 90vw); height: auto; }
  .flower { transform-origin: 200px 190px; animation: sway 5s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  .petal { transform-origin: 200px 190px; animation: bloom 1.6s ease-out both; }
  @keyframes bloom { from { transform: scale(0) rotate(var(--r)); opacity: 0; } to { transform: scale(1) rotate(var(--r)); opacity: 1; } }
  h1 {
    color: var(--text); text-align: center; margin: 8px 0 0;
    font-size: clamp(28px, 7vw, 52px); line-height: 1.2;
    animation: fade 2s 1.4s ease-out both;
    text-shadow: 0 2px 12px rgba(214, 51, 108, .25);
  }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .heart { display: inline-block; animation: beat 1.2s infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
</style>
</head>
<body>
<svg viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" aria-label="Lilyum çiçeği">
  <defs>
    <linearGradient id="petalGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffc2d6"/>
      <stop offset="100%" stop-color="#e8457a"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f7d3a"/>
      <stop offset="100%" stop-color="#5fb36b"/>
    </linearGradient>
    <g id="petal">
      <path d="M200 190 C 170 150, 175 80, 200 30 C 225 80, 230 150, 200 190 Z" fill="url(#petalGrad)" stroke="#c23461" stroke-width="1.2"/>
      <path d="M200 185 Q 200 110 200 45" stroke="#c23461" stroke-width="1" fill="none" opacity=".5"/>
      <circle cx="195" cy="140" r="2.2" fill="#9b1f4a"/>
      <circle cx="205" cy="128" r="2" fill="#9b1f4a"/>
      <circle cx="197" cy="115" r="1.8" fill="#9b1f4a"/>
      <circle cx="204" cy="150" r="1.8" fill="#9b1f4a"/>
      <circle cx="200" cy="100" r="1.5" fill="#9b1f4a"/>
    </g>
  </defs>

  <!-- Sap ve yapraklar -->
  <path d="M200 200 C 195 300, 210 400, 200 510" stroke="url(#stemGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M202 360 C 250 320, 300 320, 330 290 C 300 350, 250 365, 202 375 Z" fill="#4c9a57"/>
  <path d="M199 430 C 150 395, 100 395, 70 365 C 100 425, 150 440, 199 445 Z" fill="#3e8a49"/>
  <path d="M202 360 Q 270 335 330 290" stroke="#2f6e38" stroke-width="1" fill="none"/>
  <path d="M199 430 Q 130 410 70 365" stroke="#2f6e38" stroke-width="1" fill="none"/>

  <g class="flower">
    <!-- 6 taç yaprağı -->
    <use href="#petal" class="petal" style="--r:0deg;   animation-delay:.0s"/>
    <use href="#petal" class="petal" style="--r:60deg;  animation-delay:.15s"/>
    <use href="#petal" class="petal" style="--r:120deg; animation-delay:.3s"/>
    <use href="#petal" class="petal" style="--r:180deg; animation-delay:.45s"/>
    <use href="#petal" class="petal" style="--r:240deg; animation-delay:.6s"/>
    <use href="#petal" class="petal" style="--r:300deg; animation-delay:.75s"/>

    <!-- Erkek organlar (stamen) -->
    <g stroke="#7cbf6a" stroke-width="1.6" stroke-linecap="round">
      <line x1="200" y1="190" x2="170" y2="135"/>
      <line x1="200" y1="190" x2="230" y2="135"/>
      <line x1="200" y1="190" x2="150" y2="170"/>
      <line x1="200" y1="190" x2="250" y2="170"/>
      <line x1="200" y1="190" x2="185" y2="125"/>
      <line x1="200" y1="190" x2="215" y2="125"/>
      <line x1="200" y1="190" x2="200" y2="120" stroke="#9ed38a" stroke-width="2.4"/>
    </g>
    <g fill="#b5541c">
      <ellipse cx="170" cy="133" rx="3" ry="7" transform="rotate(-30 170 133)"/>
      <ellipse cx="230" cy="133" rx="3" ry="7" transform="rotate(30 230 133)"/>
      <ellipse cx="150" cy="169" rx="3" ry="7" transform="rotate(-70 150 169)"/>
      <ellipse cx="250" cy="169" rx="3" ry="7" transform="rotate(70 250 169)"/>
      <ellipse cx="185" cy="123" rx="3" ry="7" transform="rotate(-12 185 123)"/>
      <ellipse cx="215" cy="123" rx="3" ry="7" transform="rotate(12 215 123)"/>
    </g>
    <circle cx="200" cy="118" r="5" fill="#6aa84f"/>
    <circle cx="200" cy="190" r="9" fill="#a8d88f"/>
  </g>
</svg>

<h1>Memuriyetin hayırlı olsun güzellik <span class="heart">💗</span></h1>
</body>
</html>
